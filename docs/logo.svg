<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Ironchain logo">
  <defs>
    <linearGradient id="ic-steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a97a8"/>
      <stop offset="1" stop-color="#4a5563"/>
    </linearGradient>
    <linearGradient id="ic-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#37a0ff"/>
      <stop offset="1" stop-color="#0060d0"/>
    </linearGradient>
  </defs>
  <!-- connectors -->
  <g stroke="url(#ic-steel)" stroke-width="9" stroke-linecap="round">
    <line x1="42" y1="42" x2="64" y2="64"/>
    <line x1="64" y1="64" x2="86" y2="86"/>
  </g>
  <!-- three linked blocks along the chain -->
  <g stroke="#2b323c" stroke-width="2.5">
    <rect x="12" y="12" width="40" height="40" rx="11" fill="url(#ic-accent)"/>
    <rect x="44" y="44" width="40" height="40" rx="11" fill="url(#ic-steel)"/>
    <rect x="76" y="76" width="40" height="40" rx="11" fill="url(#ic-steel)"/>
  </g>
  <!-- hash marks on the lead block -->
  <g stroke="#eaf3ff" stroke-width="3" stroke-linecap="round" opacity="0.9">
    <line x1="24" y1="22" x2="24" y2="42"/>
    <line x1="32" y1="22" x2="32" y2="42"/>
    <line x1="18" y1="28" x2="46" y2="28"/>
    <line x1="18" y1="36" x2="46" y2="36"/>
  </g>
</svg>
